name: Transcribe podcast audio

on:
  release:
    types: [published]
  repository_dispatch:
    types: [transcribe]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing one podcast audio file
        required: true
        type: string
      model:
        description: Multilingual whisper.cpp model
        required: true
        default: small
        type: choice
        options:
          - small
          - medium

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || github.event.release.tag_name }}
      WHISPER_MODEL: ${{ inputs.model || github.event.client_payload.model || 'small' }}
    steps:
      - name: Download release audio
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio"
          for attempt in $(seq 1 12); do
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.m4a' \
              --pattern '*.mp3' \
              --pattern '*.aac' \
              --dir "$RUNNER_TEMP/audio" \
              --clobber; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "No podcast audio found in release $RELEASE_TAG" >&2
              exit 1
            fi
            sleep 10
          done

          mapfile -t audio_files < <(
            find "$RUNNER_TEMP/audio" -maxdepth 1 -type f \
              \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.aac' \) -print
          )
          if [ "${#audio_files[@]}" -ne 1 ]; then
            echo "Expected one audio file, found ${#audio_files[@]}" >&2
            exit 1
          fi
          echo "AUDIO_FILE=${audio_files[0]}" >> "$GITHUB_ENV"

      - name: Build whisper.cpp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ffmpeg opencc
          git clone --depth 1 --branch v1.8.6 \
            https://github.com/ggml-org/whisper.cpp.git \
            "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" \
            -B "$RUNNER_TEMP/whisper.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" --config Release -j 4

      - name: Restore whisper model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper.cpp/models/ggml-${{ env.WHISPER_MODEL }}.bin
          key: whisper-cpp-v1.8.6-${{ env.WHISPER_MODEL }}-ggml

      - name: Download whisper model
        run: |
          set -euo pipefail
          model_path="$RUNNER_TEMP/whisper.cpp/models/ggml-$WHISPER_MODEL.bin"
          if [ ! -s "$model_path" ]; then
            "$RUNNER_TEMP/whisper.cpp/models/download-ggml-model.sh" "$WHISPER_MODEL"
          fi
          test -s "$model_path"

      - name: Transcribe Chinese audio
        run: |
          set -euo pipefail
          stem="$(basename "$AUDIO_FILE")"
          stem="${stem%.*}"
          mkdir -p "$RUNNER_TEMP/transcripts"
          ffmpeg -v error -y -i "$AUDIO_FILE" \
            -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/audio.wav"
          "$RUNNER_TEMP/whisper.cpp/build/bin/whisper-cli" \
            -m "$RUNNER_TEMP/whisper.cpp/models/ggml-$WHISPER_MODEL.bin" \
            -f "$RUNNER_TEMP/audio.wav" \
            -l zh \
            -otxt -osrt -ovtt -np \
            -of "$RUNNER_TEMP/transcripts/$stem"
          test -s "$RUNNER_TEMP/transcripts/$stem.txt"

      - name: Convert transcripts to Simplified Chinese
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/transcripts/*.txt \
                    "$RUNNER_TEMP"/transcripts/*.srt \
                    "$RUNNER_TEMP"/transcripts/*.vtt; do
            [ -f "$f" ] || continue
            opencc -i "$f" -o "$f.tmp" -c t2s
            mv "$f.tmp" "$f"
          done

      - name: Upload transcripts to release
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/transcripts/"* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
