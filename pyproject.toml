[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-podcast-generator"
version = "0.1.0"
description = "Turn a single video link into a private podcast episode on macOS."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "en"}]
dependencies = []

[project.scripts]
personal-podcast = "personal_podcast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_podcast = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
